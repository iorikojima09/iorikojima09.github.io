<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VJ風オーディオビジュアライザー</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const maxRadius = Math.min(centerX, centerY) - 50;

    class Particle {
      constructor(angle, distance) {
        this.angle = angle;
        this.distance = distance;
        this.radius = Math.random() * 3 + 1;
        this.speed = Math.random() * 0.5 + 0.2;
      }
      update(volume) {
        this.distance += volume * 0.01;
        this.radius = Math.random() * 3 + volume * 0.02;
      }
      draw() {
        const x = centerX + Math.cos(this.angle) * this.distance;
        const y = centerY + Math.sin(this.angle) * this.distance;
        ctx.beginPath();
        ctx.arc(x, y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,0.7)`;
        ctx.fill();
      }
    }

    const particles = [];
    for (let i = 0; i < 300; i++) {
      particles.push(new Particle(Math.random() * Math.PI * 2, Math.random() * 200));
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      function animate() {
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b) / bufferLength;

        // 背景グラデーションを動的に変更
        const hue = (avg / 255) * 360;
        ctx.fillStyle = `hsl(${hue}, 70%, 5%)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 円形スペクトラムバー
        const barCount = bufferLength;
        const angleStep = (Math.PI * 2) / barCount;
        for (let i = 0; i < barCount; i++) {
          const value = dataArray[i];
          const angle = i * angleStep;
          const inner = maxRadius * 0.4;
          const outer = inner + value;
          const x1 = centerX + Math.cos(angle) * inner;
          const y1 = centerY + Math.sin(angle) * inner;
          const x2 = centerX + Math.cos(angle) * outer;
          const y2 = centerY + Math.sin(angle) * outer;

          ctx.strokeStyle = `hsl(${(i / barCount) * 360}, 100%, 60%)`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // パーティクル
        particles.forEach(p => {
          p.update(avg);
          p.draw();
        });

        requestAnimationFrame(animate);
      }

      animate();
    }).catch(err => {
      alert("マイクの使用が許可されていません。");
      console.error(err);
    });
  </script>
</body>
</html>
