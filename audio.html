<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>超反応VJビジュアライザー</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;

    let mode = 0;
    setInterval(() => {
      mode = (mode + 1) % 6;
    }, 10000);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        centerX = canvas.width / 2;
        centerY = canvas.height / 2;
        this.x = centerX;
        this.y = centerY;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 5 + 1;
        this.radius = Math.random() * 6 + 6;
        this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
      }
      update(volume) {
        this.x += Math.cos(this.angle) * this.speed * volume;
        this.y += Math.sin(this.angle) * this.speed * volume;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    const particles = Array.from({ length: 300 }, () => new Particle());

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      function animate() {
        centreX = canvas.width / 2;
        centreY = canvas.height / 2;
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b) / bufferLength;
        const amp = avg / 10;

        ctx.fillStyle = `rgba(0, 0, 0, 0.25)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const radius = Math.min(canvas.width, canvas.height) * 0.4;

        if (mode === 0) {
          // 放射ビーム
          const angleStep = (Math.PI * 2) / bufferLength;
          for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i];
            const angle = i * angleStep;
            const len = radius + value * 4;
            const x1 = centerX + Math.cos(angle) * radius;
            const y1 = centerY + Math.sin(angle) * radius;
            const x2 = centerX + Math.cos(angle) * len;
            const y2 = centerY + Math.sin(angle) * len;

            ctx.strokeStyle = `hsl(${i * 4 + amp * 10}, 100%, 60%)`;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        } else if (mode === 1) {
          // 波形スキャン（中央揺れ）
          ctx.beginPath();
          ctx.moveTo(0, centerY);
          for (let i = 0; i < bufferLength; i++) {
            const x = (i / bufferLength) * canvas.width;
            const y = centerY + (dataArray[i] - 128) * amp * 0.7;
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = `hsl(${amp * 40}, 100%, 60%)`;
          ctx.lineWidth = 12;
          ctx.stroke();
        } else if (mode === 2) {
          // 爆発パーティクル
          particles.forEach(p => {
            p.update(amp * 0.7);
            p.draw();
          });
        } else if (mode === 3) {
          // 螺旋グリッド
          const lines = 80;
          for (let i = 0; i < lines; i++) {
            const angle = i * (Math.PI * 2 / lines) + performance.now() * 0.001;
            const value = dataArray[i % bufferLength];
            const r = (value + 10) * amp * 1.5;
            const x = centerX + Math.cos(angle) * r;
            const y = centerY + Math.sin(angle) * r;

            ctx.beginPath();
            ctx.arc(x, y, 14 + amp * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${angle * 180 / Math.PI}, 100%, 70%)`;
            ctx.fill();
          }
        } else if (mode === 4) {
          // 高速シェイクバー（縦）
          const barWidth = canvas.width / bufferLength;
          for (let i = 0; i < bufferLength; i++) {
            const val = dataArray[i];
            const x = i * barWidth;
            const h = val * amp * 0.8;
            ctx.fillStyle = `hsl(${i * 4}, 100%, 70%)`;
            ctx.fillRect(x, canvas.height - h, barWidth - 2, h);
          }
        } else if (mode === 5) {
          // グリッドフラッシュ
          const cols = 10, rows = 6;
          const cellW = canvas.width / cols;
          const cellH = canvas.height / rows;
          for (let i = 0; i < cols * rows; i++) {
            const x = (i % cols) * cellW;
            const y = Math.floor(i / cols) * cellH;
            const v = dataArray[i % bufferLength];
            ctx.fillStyle = `hsl(${v * 2}, 100%, ${v / 2 + 30}%)`;
            ctx.fillRect(x, y, cellW, cellH);
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    }).catch(err => {
      alert("マイクへのアクセスが拒否されました。");
      console.error(err);
    });
  </script>
</body>
</html>
