<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字表示</title>
  <!-- Google Fonts: Noto Sans JP を読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Noto Sans JP', sans-serif; /* フォントを Noto Sans JP に変更 */
      padding: 20px;
      margin: 0;
    }
    #text {
      white-space: pre-wrap; /* 自動改行を有効にする */
      word-wrap: break-word; /* 単語の途中でも折り返し */
      font-size: 20px;
      line-height: 1.6; /* 行間を少し広げる */
    }
    #photo {
      display: none; /* 初期状態では非表示 */
      margin-top: 20px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div id="text"></div>
  <img id="photo" src="your-image.jpg" alt="画像">

  <script>
    const text = "これは1文字ずつ表示されるテキストの例です。\\nすべての文字が表示された後に画像が出現します。日本語にも対応したフォントが使われています。"; // 表示するテキストに\nを追加
    const container = document.getElementById("text");
    const photo = document.getElementById("photo");
    let i = 0;

    function typeCharacter() {
      if (i < text.length) {
        if (text[i] === '\\' && text[i + 1] === 'n') {
          container.innerHTML += '<br>'; // 改行処理
          i += 2;
        } else {
          container.innerHTML += text[i];
          i++;
        }
        setTimeout(typeCharacter, 100); // 表示速度（ミリ秒）
      } else {
        // 全テキスト表示後に画像を表示
        photo.style.display = 'block';
      }
    }

    typeCharacter();
  </script>
</body>
</html>
