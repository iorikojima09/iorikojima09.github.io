<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字表示</title>
  <!-- Google Fonts: Noto Sans JP を読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Noto Sans JP', sans-serif; /* フォントを Noto Sans JP に変更 */
      padding: 20px;
      margin: 0;
    }
    #text {
      white-space: pre-wrap; /* 自動改行を有効にする */
      word-wrap: break-word; /* 単語の途中でも折り返し */
      font-size: 15px;
      line-height: 1.6; /* 行間を少し広げる */
    }
  </style>
</head>
<body>
  <div id="text"></div>

  <script>
    const text = "羊飼いの少年サンチャゴは、アンダルシアの平原からエジプトのピラミッドに向けて旅に出た。そこに、彼を待つ宝物が隠されているという夢を信じて。長い時間を共に過ごした羊たちを売り、アフリカの砂漠を越えて少年はピラミッドを目指す。「何かを強く望めば宇宙のすべてが協力して実現するように助けてくれる」「前兆に従うこと」少年は錬金術師の導きと旅のさまざまな出会いと別れのなかで、人生の知恵を学んで行く。アルケミスト　夢を旅した少年　パウロ・コエーリョ　【この文章は2025年5月1日22時22分に更新されました。】";
    const container = document.getElementById("text");
    let i = 0;

    function typeCharacter() {
      if (i < text.length) {
        container.textContent += text[i];
        i++;
        setTimeout(typeCharacter, 50); // 表示速度（ミリ秒）
      }
    }

    typeCharacter();
  </script>
</body>
</html>
