<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>iPhoneフルスクリーン（ホーム追加用）</title>

  <!-- モバイル表示最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS Safariで全画面表示に近づける設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #app {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="app">
    ホーム画面に追加すると<br>フルスクリーンになります！
  </div>
</body>
</html>
